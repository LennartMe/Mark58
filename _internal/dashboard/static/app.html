<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#05070d">
  <title>JARVIS Remote</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#05070d;--bg2:#090913;--panel:rgba(19,20,32,.74);--panel2:rgba(255,255,255,.035);
      --line:rgba(255,255,255,.075);--line2:rgba(255,255,255,.14);
      --accent:#ff42af;--accent2:#ff8fc4;--accent3:#9e65ff;
      --glow:rgba(255,66,175,.24);--text:#eef3fb;--muted:#7d8799;--green:#49e3a6;--red:#ff5c78;
      --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      --mono:ui-monospace,"SFMono-Regular",Cascadia Mono,Consolas,monospace;
    }
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}
    body{display:flex;flex-direction:column;position:relative;isolation:isolate}
    body::before{content:"";position:fixed;inset:0;z-index:-3;background:
      radial-gradient(circle at 50% 16%,rgba(255,66,175,.10),transparent 34%),
      radial-gradient(circle at 12% 88%,rgba(158,101,255,.07),transparent 30%),
      linear-gradient(180deg,#070811 0%,#05070d 58%,#03050a 100%)}
    body::after{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.24;
      background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
      background-size:28px 28px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.85),rgba(0,0,0,.18) 70%,transparent)}
    .ambient{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
    .ambient::before,.ambient::after{content:"";position:absolute;border-radius:50%;filter:blur(32px);opacity:.42}
    .ambient::before{width:240px;height:240px;background:rgba(255,66,175,.13);top:8%;right:-100px;animation:floatA 9s ease-in-out infinite}
    .ambient::after{width:190px;height:190px;background:rgba(104,90,255,.11);bottom:15%;left:-90px;animation:floatB 11s ease-in-out infinite}
    @keyframes floatA{50%{transform:translate(-24px,34px) scale(1.08)}}@keyframes floatB{50%{transform:translate(30px,-26px) scale(.94)}}

    header{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:calc(11px + env(safe-area-inset-top)) 14px 11px;
      border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(6,8,14,.94),rgba(6,8,14,.78));backdrop-filter:blur(22px);z-index:5}
    .brand{display:flex;align-items:center;gap:10px;min-width:0}
    .brand-mark{width:28px;height:28px;border-radius:50%;position:relative;display:grid;place-items:center;border:1px solid rgba(255,66,175,.36);box-shadow:0 0 20px rgba(255,66,175,.09)}
    .brand-mark::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px rgba(255,66,175,.75);animation:corePulse 2.2s ease-in-out infinite}
    .brand-mark::after{content:"";position:absolute;inset:4px;border-radius:50%;border:1px solid rgba(255,143,196,.26);border-left-color:transparent;animation:spin 4.5s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}@keyframes corePulse{50%{transform:scale(.68);opacity:.62}}
    .brand-copy{min-width:0}.logo{font:750 13px var(--mono);letter-spacing:.25em;white-space:nowrap}.logo em{color:var(--accent);font-style:normal}.sub{font:650 8px var(--mono);letter-spacing:.18em;color:var(--muted);margin-top:2px;text-transform:uppercase}
    .spacer{flex:1}
    .pill,.enc-badge,.url{border:1px solid var(--line);background:rgba(255,255,255,.026);backdrop-filter:blur(10px)}
    .pill{display:flex;align-items:center;gap:6px;padding:6px 9px;border-radius:99px;font:750 9px var(--mono);letter-spacing:.12em;color:var(--muted);text-transform:uppercase;transition:.25s}
    .pill .dot{width:6px;height:6px;border-radius:50%;background:var(--muted)}
    .pill.on{color:var(--green);border-color:rgba(73,227,166,.28);background:rgba(73,227,166,.07)}.pill.on .dot{background:var(--green);box-shadow:0 0 10px rgba(73,227,166,.7);animation:blink 1.8s ease-in-out infinite}
    @keyframes blink{50%{opacity:.38}}
    .enc-badge{display:none;border-radius:7px;padding:5px 7px;font:750 8px var(--mono);letter-spacing:.12em}.enc-badge.on{display:block;color:var(--green);border-color:rgba(73,227,166,.20)}.enc-badge.off{display:block;color:var(--red);border-color:rgba(255,92,120,.20)}
    .url{display:none;color:var(--muted);font:600 8px var(--mono);padding:5px 7px;border-radius:7px}

    main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px 14px 20px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
    main::-webkit-scrollbar{width:3px}main::-webkit-scrollbar-thumb{background:rgba(255,255,255,.10);border-radius:3px}
    .hero{position:relative;overflow:hidden;flex:0 0 auto;padding:18px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.047),rgba(255,255,255,.018));backdrop-filter:blur(18px);box-shadow:0 16px 48px rgba(0,0,0,.20)}
    .hero::before{content:"";position:absolute;width:250px;height:250px;border-radius:50%;right:-105px;top:-115px;background:radial-gradient(circle,rgba(255,66,175,.22),rgba(255,66,175,.05) 42%,transparent 70%);pointer-events:none}
    .hero-top{display:flex;align-items:center;gap:15px;position:relative;z-index:1}.orb{width:68px;height:68px;flex:0 0 auto;border-radius:50%;position:relative;display:grid;place-items:center;background:radial-gradient(circle at 42% 37%,rgba(255,255,255,.30),rgba(255,66,175,.24) 17%,rgba(255,66,175,.08) 39%,rgba(255,66,175,.01) 58%,transparent 69%);box-shadow:0 0 44px rgba(255,66,175,.15)}
    .orb::before,.orb::after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,143,196,.34)}.orb::before{inset:7px;border-left-color:transparent;border-right-color:rgba(158,101,255,.45);animation:spin 5.5s linear infinite}.orb::after{inset:14px;border-top-color:transparent;animation:spin 3.7s linear infinite reverse}.orb-core{width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff,0 0 22px var(--accent),0 0 42px var(--accent)}
    .hero-copy{min-width:0}.eyebrow{font:750 9px var(--mono);letter-spacing:.18em;color:var(--accent2);text-transform:uppercase;margin-bottom:5px}.hero-title{font-size:20px;font-weight:760;letter-spacing:.03em}.hero-note{font-size:12px;line-height:1.5;color:var(--muted);margin-top:5px}
    .telemetry{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:15px;position:relative;z-index:1}.telemetry>div{padding:8px 9px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.025)}.telemetry b{display:block;font:750 9px var(--mono);letter-spacing:.1em;color:var(--text);margin-bottom:2px}.telemetry span{display:block;font-size:10px;color:var(--muted)}

    .msg{max-width:86%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.56;animation:pop .20s cubic-bezier(.2,.75,.25,1)}@keyframes pop{from{opacity:0;transform:translateY(7px) scale(.99)}}
    .msg-j{align-self:flex-start;background:linear-gradient(145deg,rgba(255,66,175,.105),rgba(255,66,175,.04));border:1px solid rgba(255,66,175,.18);border-bottom-left-radius:5px;box-shadow:0 8px 24px rgba(0,0,0,.10)}
    .msg-u{align-self:flex-end;background:linear-gradient(145deg,rgba(255,255,255,.060),rgba(255,255,255,.025));border:1px solid var(--line);border-bottom-right-radius:5px}
    .msg-sys{align-self:center;max-width:92%;font:600 10px var(--mono);color:var(--muted);padding:5px 10px;background:rgba(255,255,255,.018);border:1px solid rgba(255,255,255,.045);border-radius:99px;letter-spacing:.04em;text-align:center}
    .lbl{font:750 8px var(--mono);letter-spacing:.18em;text-transform:uppercase;opacity:.72;margin-bottom:5px}.msg-j .lbl{color:var(--accent2)}.msg-u .lbl{color:var(--muted);text-align:right}

    .msg-file{align-self:flex-end;background:linear-gradient(145deg,rgba(255,255,255,.058),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:16px;border-bottom-right-radius:5px;padding:12px 14px;display:flex;align-items:center;gap:12px;max-width:88%;animation:pop .18s ease}.fc-icon{font-size:25px;flex-shrink:0}.fc-meta{flex:1;min-width:0}.fc-lbl{font:750 8px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}.fc-name{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fc-size{font-size:10px;color:var(--muted);margin-top:2px}.fc-bar-wrap{height:3px;background:rgba(255,255,255,.07);border-radius:2px;margin-top:7px;overflow:hidden}.fc-bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width .12s linear}.fc-status{font:750 9px var(--mono);letter-spacing:.08em;color:var(--muted);flex-shrink:0}.fc-status.done{color:var(--green)}.fc-status.err{color:var(--red)}.fc-dl{display:block;margin-top:6px;font-size:11px;color:var(--accent2);text-decoration:none;font-weight:700}

    footer{flex:0 0 auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:linear-gradient(180deg,rgba(5,7,13,.78),rgba(5,7,13,.97));backdrop-filter:blur(22px);display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;gap:7px;align-items:center;z-index:5}
    #inp{min-width:0;width:100%;padding:12px 13px;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:13px;color:var(--text);font-size:14px;outline:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.004);transition:.18s}#inp:focus{border-color:rgba(255,66,175,.48);box-shadow:0 0 0 3px rgba(255,66,175,.08)}#inp::placeholder{color:#667183}
    .btn,.btn-attach,#mic-btn{height:43px;min-width:43px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.032);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.16s;user-select:none;-webkit-tap-highlight-color:transparent}.btn:active,.btn-attach:active,#mic-btn:active{transform:scale(.94)}
    .btn-attach,#mic-btn{font-size:16px;padding:0 11px}.btn-attach:hover,#mic-btn:hover{border-color:rgba(255,66,175,.34);color:var(--accent2)}
    .btn{padding:0 14px;font:800 9px var(--mono);letter-spacing:.12em}.btn-send{color:white;border-color:rgba(255,66,175,.44);background:linear-gradient(135deg,rgba(255,66,175,.88),rgba(190,65,255,.76));box-shadow:0 7px 22px rgba(255,66,175,.13)}.btn-wake{display:none}.btn-wake.show{display:flex;color:var(--green);border-color:rgba(73,227,166,.28);background:rgba(73,227,166,.07)}
    #mic-btn.recording{color:#fff;border-color:rgba(255,92,120,.48);background:rgba(255,92,120,.18);box-shadow:0 0 22px rgba(255,92,120,.13);animation:micPulse 1s ease-in-out infinite}@keyframes micPulse{50%{opacity:.62;transform:scale(.96)}}#mic-btn.unsupported{opacity:.28;cursor:not-allowed}

    #toast{position:fixed;z-index:30;top:calc(68px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-10px);max-width:calc(100vw - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(9,15,18,.88);border:1px solid rgba(73,227,166,.30);backdrop-filter:blur(18px);color:var(--green);font:750 10px var(--mono);letter-spacing:.08em;padding:8px 15px;border-radius:99px;opacity:0;transition:.22s;pointer-events:none;box-shadow:0 10px 35px rgba(0,0,0,.28)}#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    @media(min-width:700px){header{padding-left:22px;padding-right:22px}.url{display:block}main{width:min(760px,100%);margin:0 auto;padding-left:20px;padding-right:20px}.hero{padding:21px}.orb{width:78px;height:78px}footer{grid-template-columns:auto minmax(0,620px) auto auto auto;justify-content:center;padding-left:22px;padding-right:22px}}
    @media(max-width:430px){.enc-badge{display:none!important}.sub{display:none}.brand-mark{width:25px;height:25px}.hero{padding:15px}.orb{width:61px;height:61px}.hero-title{font-size:18px}.telemetry>div{padding:7px}.telemetry b{font-size:8px}.telemetry span{font-size:9px}.btn-send{padding:0 11px}.btn-wake.show{position:absolute;right:12px;bottom:67px;height:34px;border-radius:99px}.msg{max-width:90%}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
    *{outline:0!important;-webkit-outline:0!important;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-appearance:none;outline-width:0!important}
    input,textarea{-webkit-user-select:text;user-select:text}
    *:focus,*:focus-visible,*:focus-within,*:active{outline:0!important;-webkit-outline:0!important;outline-width:0!important;outline-offset:0!important;box-shadow:none!important;border-color:inherit!important;background-color:inherit!important;-webkit-box-shadow:none!important}
    button:focus,button:focus-visible,button:active,div:focus,div:focus-visible,span:focus{outline:0!important;-webkit-outline:0!important;box-shadow:none!important;-webkit-box-shadow:none!important}
    *::selection{background:transparent!important;color:inherit!important}
    *::-moz-selection{background:transparent!important;color:inherit!important}
    body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;outline:0!important}
    input:focus,textarea:focus{outline:0!important;border-color:rgba(255,255,255,0.08)!important;box-shadow:none!important;-webkit-box-shadow:none!important}
    #settings-panel *{outline:0!important;-webkit-outline:0!important}
    #settings-panel *:focus,#settings-panel *:focus-visible{outline:0!important;-webkit-outline:0!important;box-shadow:none!important}
  </style>
</head>
<body>
  <div class="ambient"></div>
  <div id="toast"></div>
  <header>
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-copy"><div class="logo"><em>J</em>ARVIS</div><div class="sub">Mark 57 Remote</div></div>
    </div>
    <div class="pill" id="pill"><span class="dot"></span><span id="st">Connecting</span></div>
    <div class="enc-badge" id="enc">AES-GCM</div>
    <div class="spacer"></div>
    <button id="settings-btn" title="Settings" style="background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:6px;display:flex;align-items:center;justify-content:center;">⚙</button>
    <div class="url">__IP__:__PORT__</div>
  </header>

  <main id="feed">
    <section class="hero" id="remote-hero">
      <div class="hero-top">
        <div class="orb"><div class="orb-core"></div></div>
        <div class="hero-copy">
          <div class="eyebrow">Secure Remote Link</div>
          <div class="hero-title">JARVIS IS WITH YOU</div>
          <div class="hero-note">Send commands, speak through your phone, or transfer files directly to Mark 57.</div>
        </div>
      </div>
      <div class="telemetry">
        <div><b>LINK</b><span>Encrypted</span></div>
        <div><b>CONTROL</b><span>Remote</span></div>
        <div><b>SESSION</b><span>Private</span></div>
      </div>
    </section>
  </main>

  <div id="settings-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:50;backdrop-filter:blur(4px)"></div>
  <div id="settings-panel" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:51;width:min(90vw,500px);max-height:80vh;background:linear-gradient(145deg,rgba(19,20,32,0.98),rgba(9,13,20,0.95));border:1px solid rgba(255,66,175,0.2);border-radius:20px;padding:24px;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.4)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h2 id="settings-title" style="font-size:18px;font-weight:700;margin:0;color:#eef3fb">Settings</h2>
      <button id="settings-back" style="display:none;background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;margin-right:12px">← Back</button>
      <button id="settings-close" style="background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:0">×</button>
    </div>

    <div id="settings-main" style="">
      <button id="plugins-section-btn" style="width:100%;padding:16px;background:rgba(255,66,175,0.08);border:1px solid rgba(255,66,175,0.15);border-radius:14px;text-align:left;color:#eef3fb;font-size:14px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <span>Plugins</span>
        <span style="color:var(--muted);font-size:16px">→</span>
      </button>
    </div>

    <div id="plugins-view" style="display:none">
      <h3 style="font-size:14px;font-weight:700;color:var(--accent2);text-transform:uppercase;letter-spacing:0.1em;margin:0 0 15px 0">Active Plugins</h3>
      
      <div id="plugins-list" style="display:flex;flex-direction:column;gap:10px;margin-bottom:20px">
        <!-- plugins render here -->
      </div>

      <h3 style="font-size:14px;font-weight:700;color:var(--accent2);text-transform:uppercase;letter-spacing:0.1em;margin:0 0 12px 0">Add Plugin</h3>
      <div style="display:flex;gap:8px">
        <input id="plugin-name" placeholder="Plugin name…" style="flex:1;padding:10px 12px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;color:#eef3fb;font-size:13px;outline:none">
        <button id="add-plugin-btn" style="padding:10px 16px;background:linear-gradient(135deg,rgba(255,66,175,0.8),rgba(190,65,255,0.7));border:1px solid rgba(255,66,175,0.4);border-radius:10px;color:white;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap">Add</button>
      </div>
    </div>
  </div>

  <footer>
    <label class="btn-attach" id="file-label" for="file-inp" title="Send file">＋</label>
    <input id="inp" placeholder="Tell JARVIS what to do…" autocomplete="off" autocapitalize="sentences">
    <input type="file" id="file-inp" multiple accept="*/*" style="display:none">
    <button id="mic-btn" onclick="doMic()" title="Voice command">◉</button>
    <button class="btn btn-wake" id="wake" onclick="doWake()">WAKE</button>
    <button class="btn btn-send" onclick="doSend()">SEND</button>
  </footer>

  <script>
    // ── Auth — bearer token ───────────────────────────────────────────────────
    const _authToken  = sessionStorage.getItem('jarvis_token');
    const _sessionKey = sessionStorage.getItem('jarvis_key');

    if (!_authToken) {
      location.replace('/login');
    }

    function _authHeader() { return { 'Authorization': `Bearer ${_authToken}` }; }
    function _authFetch(url, opts = {}) {
      opts.headers = Object.assign({}, opts.headers, _authHeader());
      return fetch(url, opts);
    }

    // ── AES-256-GCM encryption (Web Crypto) ──────────────────────────────────
    //
    // WHAT CHANGED, AND WHY THE LIBRARY WENT WITH IT
    //   This used CryptoJS with AES-CBC and a key of SHA256(pairingKey+salt).
    //   Two problems, both on the server side of the same conversation:
    //
    //   CBC hides a message but does not authenticate it, so an attacker on the
    //   same network could alter the ciphertext and the assistant would act on
    //   whatever fell out. GCM refuses a message that has been touched.
    //
    //   One round of SHA-256 over an eight-character key is an offline search
    //   measured in seconds on a GPU. PBKDF2 at 200k rounds makes each guess
    //   about a hundred thousand times more expensive, and costs this page one
    //   derivation at pairing time.
    //
    //   Both are native in Web Crypto, so the 60 KB CryptoJS bundle is no
    //   longer needed. crypto.subtle exists only in a secure context, which is
    //   why the server now insists on HTTPS instead of quietly falling back.
    const _AES_SALT   = 'JARVIS-DASHBOARD-v1';
    const _KDF_ROUNDS = 200000;
    let _aesKey = null;

    async function _initCrypto(key) {
      if (!window.crypto || !crypto.subtle) return false;
      try {
        const enc  = new TextEncoder();
        const base = await crypto.subtle.importKey(
          'raw', enc.encode(key), 'PBKDF2', false, ['deriveKey']);
        _aesKey = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: enc.encode(_AES_SALT),
            iterations: _KDF_ROUNDS, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['encrypt']);
        return true;
      } catch { return false; }
    }

    async function _encrypt(plaintext) {
      if (!_aesKey) return null;
      try {
        // A fresh 12-byte nonce per message. Reusing one under the same key is
        // the single way to break GCM, so it is generated here and never
        // stored, cached or derived from anything.
        const nonce = crypto.getRandomValues(new Uint8Array(12));
        const ct    = new Uint8Array(await crypto.subtle.encrypt(
          { name: 'AES-GCM', iv: nonce },
          _aesKey, new TextEncoder().encode(plaintext)));
        const out = new Uint8Array(nonce.length + ct.length);
        out.set(nonce, 0);
        out.set(ct, nonce.length);
        let bin = '';
        for (const b of out) bin += String.fromCharCode(b);
        return btoa(bin);
      } catch { return null; }
    }

    let _encReady  = false;
    const encBadge = document.getElementById('enc');
    encBadge.textContent = 'AES-GCM';
    // Deriving the key is PBKDF2 over 200k rounds, so it is awaited rather than
    // done inline — on a phone that is a few hundred milliseconds, and blocking
    // the parse for it would stall the whole page.
    (async () => {
      _encReady = _sessionKey ? await _initCrypto(_sessionKey) : false;
      if (_encReady) {
        encBadge.className = 'enc-badge on';
      } else {
        encBadge.className = 'enc-badge off';
        encBadge.textContent = 'NO ENC';
      }
    })();

    // ── WebSocket ─────────────────────────────────────────────────────────────
    const feed  = document.getElementById('feed');
    const pill  = document.getElementById('pill');
    const stTxt = document.getElementById('st');
    const wake  = document.getElementById('wake');

    const _wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
    const _wsUrl   = `${_wsProto}://${location.host}/ws?token=${encodeURIComponent(_authToken)}`;
    const ws       = new WebSocket(_wsUrl);

    ws.onopen    = () => { 
      toast('Connected to JARVIS');
    };
    ws.onclose   = () => sys('Connection lost — refresh to reconnect.');
    ws.onerror   = () => sys('Connection error.');
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'log')           append(m.speaker, m.text);
      if (m.type === 'status')        setStatus(m.state);
      if (m.type === 'wake')          sys('Wake word detected — connecting…');
      if (m.type === 'sys')           sys(m.text);
      if (m.type === 'file_received') _onFileReceived(m);
      if (m.type === 'news')          append('jarvis', m.text);
    };

    function setStatus(s) {
      if (s === 'active') {
        pill.className = 'pill on'; stTxt.textContent = 'Active'; wake.classList.remove('show');
      } else {
        pill.className = 'pill'; stTxt.textContent = 'Sleeping'; wake.classList.add('show');
      }
    }

    function append(speaker, text) {
      // suppress jarvis greetings, welcomes, and intro messages
      if (speaker === 'jarvis') {
        const lower = text.toLowerCase().trim();
        // block all welcome/jarvis greeting variants
        if (lower.includes('welcome to jarvis') || lower.includes('welcome to') ||
            lower.includes('hello') || lower.includes('hi there') || 
            lower.includes('i am jarvis') || lower.includes('im jarvis') || lower.includes('greetings') ||
            lower.includes('nice to meet') || lower.includes('ready to assist') ||
            lower === 'welcome' || lower === 'hello jarvis' || lower === 'hi jarvis' ||
            lower.startsWith('welcome') || lower.startsWith('hello') || lower.startsWith('hi')) {
          return;
        }
      }
      const d = document.createElement('div');
      if (speaker === 'jarvis') {
        d.className = 'msg msg-j';
        d.innerHTML = `<div class="lbl">Jarvis</div>${esc(text)}`;
      } else {
        d.className = 'msg msg-u';
        d.innerHTML = `<div class="lbl">You</div>${esc(text)}`;
      }
      feed.appendChild(d);
      feed.scrollTop = feed.scrollHeight;
    }

    function sys(text) {
      const d = document.createElement('div');
      d.className = 'msg msg-sys'; d.textContent = text;
      feed.appendChild(d); feed.scrollTop = feed.scrollHeight;
    }

    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── File helpers ──────────────────────────────────────────────────────────
    function _fileIcon(name) {
      const ext = (name.split('.').pop() || '').toLowerCase();
      if (['jpg','jpeg','png','gif','webp','heic','heif','avif','bmp','svg'].includes(ext)) return '🖼️';
      if (['mp4','mov','avi','mkv','webm','m4v','3gp'].includes(ext))                       return '🎬';
      if (['mp3','m4a','wav','flac','aac','ogg','opus'].includes(ext))                      return '🎵';
      if (['pdf'].includes(ext))                                                             return '📋';
      if (['doc','docx','txt','md','rtf','odt'].includes(ext))                              return '📝';
      if (['xls','xlsx','csv','ods'].includes(ext))                                         return '📊';
      if (['ppt','pptx','odp'].includes(ext))                                               return '📑';
      if (['zip','rar','7z','tar','gz','bz2','xz'].includes(ext))                          return '📦';
      if (['apk','exe','dmg','deb','rpm','msi'].includes(ext))                              return '⚙️';
      return '📎';
    }

    function _fmtSize(bytes) {
      if (bytes < 1024)             return bytes + ' B';
      if (bytes < 1024 * 1024)     return (bytes / 1024).toFixed(1) + ' KB';
      if (bytes < 1024 ** 3)       return (bytes / 1024 / 1024).toFixed(1) + ' MB';
      return (bytes / 1024 ** 3).toFixed(2) + ' GB';
    }

    // ── File upload (phone → computer) ────────────────────────────────────────
    function _uploadFile(file) {
      const id = 'fc_' + Date.now() + '_' + Math.random().toString(36).slice(2);

      // Create file card in feed
      const card = document.createElement('div');
      card.className = 'msg-file';
      card.id = id;
      card.innerHTML = `
        <div class="fc-icon">${_fileIcon(file.name)}</div>
        <div class="fc-meta">
          <div class="fc-lbl">Sending</div>
          <div class="fc-name">${esc(file.name)}</div>
          <div class="fc-size">${_fmtSize(file.size)}</div>
          <div class="fc-bar-wrap"><div class="fc-bar" id="${id}_bar"></div></div>
        </div>
        <div class="fc-status" id="${id}_st">0%</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload');
      xhr.setRequestHeader('Authorization', `Bearer ${_authToken}`);

      xhr.upload.onprogress = (e) => {
        if (!e.lengthComputable) return;
        const pct = Math.round(e.loaded / e.total * 100);
        const bar = document.getElementById(`${id}_bar`);
        const st  = document.getElementById(`${id}_st`);
        if (bar) bar.style.width = pct + '%';
        if (st)  st.textContent  = pct + '%';
      };

      xhr.onload = () => {
        const bar  = document.getElementById(`${id}_bar`);
        const st   = document.getElementById(`${id}_st`);
        const meta = card.querySelector('.fc-meta');
        const lbl  = card.querySelector('.fc-lbl');
        if (xhr.status === 200) {
          let savedName = file.name;
          try { savedName = JSON.parse(xhr.responseText).name || file.name; } catch {}
          const dlUrl = `/uploads/${encodeURIComponent(savedName)}?token=${encodeURIComponent(_authToken)}`;
          if (bar)  { bar.style.width = '100%'; bar.style.background = 'var(--green)'; }
          if (st)   { st.textContent = '✓'; st.className = 'fc-status done'; }
          if (lbl)  lbl.textContent = 'Sent';
          if (meta) meta.insertAdjacentHTML('beforeend',
            `<a class="fc-dl" href="${dlUrl}" download="${esc(savedName)}">⬇ Download back</a>`);
          toast('File sent!');
        } else {
          let errMsg = 'Upload failed';
          try { errMsg = JSON.parse(xhr.responseText).error || errMsg; } catch {}
          if (bar) bar.style.background = '#f87171';
          if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
          if (lbl) lbl.textContent = errMsg;
        }
      };

      xhr.onerror = () => {
        const st  = document.getElementById(`${id}_st`);
        const lbl = card.querySelector('.fc-lbl');
        if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
        if (lbl) lbl.textContent = 'Connection error';
      };

      const fd = new FormData();
      fd.append('file', file);
      xhr.send(fd);
    }

    // File received by another WebSocket client (e.g., second open tab)
    function _onFileReceived(m) {
      const dlUrl = `/uploads/${encodeURIComponent(m.name)}?token=${encodeURIComponent(_authToken)}`;
      const card  = document.createElement('div');
      card.className = 'msg-file';
      card.innerHTML = `
        <div class="fc-icon">${_fileIcon(m.name)}</div>
        <div class="fc-meta">
          <div class="fc-lbl">Received</div>
          <div class="fc-name">${esc(m.name)}</div>
          <div class="fc-size">${_fmtSize(m.size)}</div>
          <a class="fc-dl" href="${dlUrl}" download="${esc(m.name)}">⬇ Download</a>
        </div>
        <div class="fc-status done">✓</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;
      toast('File received on computer!');
    }

    // File input change handler
    const fileLabel = document.getElementById('file-label');
    const fileInp   = document.getElementById('file-inp');

    fileInp.addEventListener('change', function () {
      Array.from(this.files).forEach(_uploadFile);
      this.value = ''; // reset so the same file can be re-sent
      fileLabel.blur();
    });

    fileInp.addEventListener('cancel', () => {
      fileLabel.blur();
    });

    fileLabel.addEventListener('click', (e) => {
      setTimeout(() => fileLabel.blur(), 0);
    });

    // ── Clear focus artifacts ──────────────────────────────────────────────────
    const header = document.querySelector('header');
    const inp = document.getElementById('inp');
    
    // clear all focus when window regains focus (after settings close)
    window.addEventListener('focus', () => {
      setTimeout(() => {
        if (document.activeElement && document.activeElement !== inp && document.activeElement !== fileInp && document.activeElement !== pluginNameInput && !settingsPanel.contains(document.activeElement)) {
          document.activeElement.blur();
        }
        // force remove any selection
        window.getSelection()?.removeAllRanges();
      }, 100);
    });

    // blur immediately on any header click (but not on settings button)
    header.addEventListener('click', (e) => {
      if (e.target !== settingsBtn && !settingsBtn.contains(e.target)) {
        if (document.activeElement && document.activeElement !== inp && document.activeElement !== fileInp && !settingsPanel.contains(document.activeElement)) {
          document.activeElement.blur();
        }
      }
      window.getSelection()?.removeAllRanges();
    }, true);

    // blur on focus for header elements
    header.addEventListener('focus', (e) => {
      if (e.target !== inp && e.target !== fileInp) {
        setTimeout(() => e.target?.blur(), 0);
      }
    }, true);

    // on any body click, clear selections and focus
    document.addEventListener('mousedown', (e) => {
      window.getSelection()?.removeAllRanges();
    }, true);

    // disable right-click context menu
    document.addEventListener('contextmenu', (e) => {
      e.preventDefault();
    });

    // prevent long-press selection
    document.addEventListener('touchstart', () => {
      window.getSelection()?.removeAllRanges();
    }, true);

    document.addEventListener('touchend', () => {
      window.getSelection()?.removeAllRanges();
      document.activeElement?.blur();
    }, true);

    // aggressive cleanup on any interaction end
    document.addEventListener('pointerup', () => {
      setTimeout(() => {
        window.getSelection()?.removeAllRanges();
        if (document.activeElement && !document.activeElement.matches('input, textarea')) {
          document.activeElement.blur();
        }
      }, 10);
    }, true);

    // kill focus on any element after it gains focus (except inputs)
    document.addEventListener('focusin', (e) => {
      if (!e.target.matches('input, textarea, button') || !settingsPanel.contains(e.target)) {
        setTimeout(() => e.target?.blur(), 5);
      }
    }, true);

    // ── Plugin Management ──────────────────────────────────────────────────────
    let _plugins = JSON.parse(localStorage.getItem('jarvis_plugins')) || [];

    function renderPlugins() {
      const list = document.getElementById('plugins-list');
      list.innerHTML = '';
      if (_plugins.length === 0) {
        list.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:20px;text-align:center">No plugins yet</div>';
        return;
      }
      _plugins.forEach((plugin, idx) => {
        const el = document.createElement('div');
        el.style.cssText = 'display:flex;justify-content:space-between;align-items:center;padding:14px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:12px';
        el.innerHTML = `
          <span style="color:#eef3fb;font-size:14px;font-weight:600;flex:1">${esc(plugin.name)}</span>
          <div style="display:flex;gap:8px;align-items:center">
            <button class="plugin-toggle" data-idx="${idx}" style="padding:8px 14px;background:${plugin.enabled ? 'linear-gradient(135deg,rgba(73,227,166,0.3),rgba(73,227,166,0.15))' : 'linear-gradient(135deg,rgba(255,92,120,0.3),rgba(255,92,120,0.15))'};border:1px solid ${plugin.enabled ? 'rgba(73,227,166,0.4)' : 'rgba(255,92,120,0.4)'};border-radius:8px;color:${plugin.enabled ? '#49e3a6' : '#ff5c78'};font-size:12px;font-weight:700;cursor:pointer;outline:none;min-width:45px">${plugin.enabled ? 'ON' : 'OFF'}</button>
            <button class="plugin-remove" data-idx="${idx}" style="padding:8px 10px;background:rgba(255,92,120,0.15);border:1px solid rgba(255,92,120,0.3);border-radius:8px;color:#ff5c78;font-size:12px;font-weight:600;cursor:pointer;outline:none">Remove</button>
          </div>
        `;
        list.appendChild(el);
      });

      // attach event listeners
      document.querySelectorAll('.plugin-toggle').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = parseInt(btn.dataset.idx);
          _plugins[idx].enabled = !_plugins[idx].enabled;
          localStorage.setItem('jarvis_plugins', JSON.stringify(_plugins));
          renderPlugins();
        });
      });

      document.querySelectorAll('.plugin-remove').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = parseInt(btn.dataset.idx);
          _plugins.splice(idx, 1);
          localStorage.setItem('jarvis_plugins', JSON.stringify(_plugins));
          renderPlugins();
        });
      });
    }

    function showPluginsView() {
      document.getElementById('settings-main').style.display = 'none';
      document.getElementById('plugins-view').style.display = 'block';
      document.getElementById('settings-title').textContent = 'Plugins';
      document.getElementById('settings-back').style.display = 'block';
      renderPlugins();
    }

    function showMainSettings() {
      document.getElementById('settings-main').style.display = 'block';
      document.getElementById('plugins-view').style.display = 'none';
      document.getElementById('settings-title').textContent = 'Settings';
      document.getElementById('settings-back').style.display = 'none';
    }

    const settingsBtn = document.getElementById('settings-btn');
    const settingsOverlay = document.getElementById('settings-overlay');
    const settingsPanel = document.getElementById('settings-panel');
    const settingsClose = document.getElementById('settings-close');
    const settingsBack = document.getElementById('settings-back');
    const pluginsSectionBtn = document.getElementById('plugins-section-btn');
    const addPluginBtn = document.getElementById('add-plugin-btn');
    const pluginNameInput = document.getElementById('plugin-name');

    settingsBtn.addEventListener('click', () => {
      settingsOverlay.style.display = 'block';
      settingsPanel.style.display = 'block';
      showMainSettings();
    });

    settingsClose.addEventListener('click', () => {
      // nuke focus before hiding
      document.activeElement?.blur();
      document.body.blur();
      window.getSelection()?.removeAllRanges();
      
      settingsOverlay.style.display = 'none';
      settingsPanel.style.display = 'none';
      showMainSettings();
      
      // triple cleanup
      setTimeout(() => {
        if (document.activeElement) document.activeElement.blur();
        document.body.blur();
        window.getSelection()?.removeAllRanges();
        // nuke every element's focus state
        document.querySelectorAll('*').forEach(el => {
          try { el.blur(); } catch(_) {}
        });
      }, 0);
      
      setTimeout(() => {
        window.getSelection()?.removeAllRanges();
      }, 50);
    });

    settingsBack.addEventListener('click', () => {
      showMainSettings();
      // cleanup
      setTimeout(() => {
        document.activeElement?.blur();
        window.getSelection()?.removeAllRanges();
      }, 0);
    });

    settingsOverlay.addEventListener('click', () => {
      // nuke focus before hiding
      document.activeElement?.blur();
      document.body.blur();
      window.getSelection()?.removeAllRanges();
      
      settingsOverlay.style.display = 'none';
      settingsPanel.style.display = 'none';
      showMainSettings();
      
      // triple cleanup
      setTimeout(() => {
        if (document.activeElement) document.activeElement.blur();
        document.body.blur();
        window.getSelection()?.removeAllRanges();
        document.querySelectorAll('*').forEach(el => {
          try { el.blur(); } catch(_) {}
        });
      }, 0);
      
      setTimeout(() => {
        window.getSelection()?.removeAllRanges();
      }, 50);
    });

    pluginsSectionBtn.addEventListener('click', () => {
      showPluginsView();
    });

    addPluginBtn.addEventListener('click', () => {
      const name = pluginNameInput.value.trim();
      if (!name) return;
      _plugins.push({ name, enabled: true });
      localStorage.setItem('jarvis_plugins', JSON.stringify(_plugins));
      pluginNameInput.value = '';
      renderPlugins();
    });

    pluginNameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addPluginBtn.click();
    });

    // ── Commands ──────────────────────────────────────────────────────────────
    async function doSend() {
      const inp = document.getElementById('inp');
      const txt = inp.value.trim();
      if (!txt) return;
      inp.value = '';
      append('user', txt);
      const enc  = await _encrypt(txt);
      const body = enc ? { enc } : { text: txt };
      _authFetch('/api/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    }

    function doWake() {
      sys('Sending wake signal…');
      _authFetch('/api/wake', { method: 'POST' });
    }

    document.getElementById('inp').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
    });

    // ── Toast ─────────────────────────────────────────────────────────────────
    let _toastTimer;
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
    }

    // ── Real-time Voice — PCM16 WebSocket → Gemini Live ──────────────────────
    const micBtn  = document.getElementById('mic-btn');
    let _voiceWs  = null;
    let _audioCtx = null;
    let _micStm   = null;
    let _audioNd  = null;

    function _micIdle() {
      micBtn.innerHTML = '🎤';
      micBtn.title     = 'Voice — tap to speak';
      micBtn.classList.remove('recording');
    }

    // Float32 PCM → resample to 16 kHz + convert to Int16
    function _f32toPcm16(f32, srcRate) {
      let s = f32;
      if (srcRate !== 16000) {
        const ratio = srcRate / 16000;
        const len   = Math.round(f32.length / ratio);
        s = new Float32Array(len);
        for (let i = 0; i < len; i++)
          s[i] = f32[Math.min(Math.round(i * ratio), f32.length - 1)];
      }
      const out = new Int16Array(s.length);
      for (let i = 0; i < s.length; i++)
        out[i] = Math.max(-32768, Math.min(32767, Math.round(s[i] * 32768)));
      return out.buffer;
    }

    function _showVoiceSetup() {
      if (document.getElementById('voice-setup')) return; // show once
      const origin = location.origin;
      const card = document.createElement('div');
      card.id = 'voice-setup';
      card.style.cssText = [
        'align-self:stretch', 'background:rgba(99,102,241,0.07)',
        'border:1px solid rgba(99,102,241,0.22)', 'border-radius:14px',
        'padding:16px 18px', 'font-size:13px', 'line-height:1.8',
        'animation:pop 0.18s ease'
      ].join(';');
      card.innerHTML =
        '<div style="font-weight:700;color:#818cf8;letter-spacing:.5px;margin-bottom:10px">🎤 One-time voice setup</div>' +
        '<ol style="padding-left:18px;color:#8899aa;margin:0;display:flex;flex-direction:column;gap:4px">' +
        '<li>Open a new tab → go to <span style="background:rgba(255,255,255,0.07);padding:1px 6px;border-radius:4px;font-family:monospace;font-size:12px">chrome://flags</span></li>' +
        '<li>Search: <strong style="color:#dde3ed">Insecure origins treated as secure</strong></li>' +
        '<li>Paste this URL into the box:<br><span id="flags-url" style="background:rgba(255,255,255,0.07);padding:2px 8px;border-radius:4px;font-family:monospace;font-size:11px;user-select:all;cursor:pointer">' + esc(origin) + '</span></li>' +
        '<li>Set to <strong style="color:#22c55e">Enabled</strong> → tap <strong style="color:#dde3ed">Relaunch</strong></li>' +
        '<li>Return here and tap 🎤</li>' +
        '</ol>';
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;
      // tap to copy
      card.querySelector('#flags-url').addEventListener('click', () => {
        navigator.clipboard?.writeText(origin).then(() => toast('URL copied!')).catch(() => {});
      });
    }

    async function doMic() {
      if (_voiceWs) { _stopVoice(); return; }

      if (!navigator.mediaDevices?.getUserMedia) {
        _showVoiceSetup();
        return;
      }
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
        });
      } catch (e) {
        sys(e.name === 'NotAllowedError'
          ? 'Microphone denied — tap the address bar lock and allow microphone.'
          : 'Mic error: ' + e.message);
        return;
      }

      // 16 kHz context (fall back to native rate — _f32toPcm16 resamples)
      let ctx;
      try { ctx = new AudioContext({ sampleRate: 16000 }); }
      catch (_) { ctx = new AudioContext(); }
      if (ctx.state === 'suspended') await ctx.resume();

      const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(
        `${wsProto}://${location.host}/ws/phone-audio?token=${encodeURIComponent(_authToken)}`
      );
      ws.binaryType = 'arraybuffer';

      ws.onopen = async () => {
        const rate = ctx.sampleRate;
        const src  = ctx.createMediaStreamSource(stream);

        // AudioWorklet (modern) — runs in dedicated audio thread
        const wCode = `class J extends AudioWorkletProcessor{process(i){const c=i[0]?.[0];if(c)this.port.postMessage(c.slice());return true;}}registerProcessor('j',J);`;
        try {
          const burl = URL.createObjectURL(new Blob([wCode], { type: 'application/javascript' }));
          await ctx.audioWorklet.addModule(burl);
          URL.revokeObjectURL(burl);
          const nd = new AudioWorkletNode(ctx, 'j');
          // Buffer to 1024 samples (64 ms at 16 kHz) before sending —
          // matches PC mic chunk size, prevents queue flooding on the server.
          let _pbuf = [], _plen = 0;
          nd.port.onmessage = e => {
            const chunk = new Int16Array(_f32toPcm16(e.data, rate));
            _pbuf.push(chunk); _plen += chunk.length;
            if (_plen >= 1024) {
              const out = new Int16Array(_plen); let off = 0;
              for (const c of _pbuf) { out.set(c, off); off += c.length; }
              if (ws.readyState === 1) ws.send(out.buffer);
              _pbuf = []; _plen = 0;
            }
          };
          src.connect(nd);
          _audioNd = nd;
        } catch (_) {
          // ScriptProcessor fallback (deprecated, still works everywhere)
          const sp = ctx.createScriptProcessor(4096, 1, 1);
          sp.onaudioprocess = e => {
            if (ws.readyState === 1) ws.send(_f32toPcm16(e.inputBuffer.getChannelData(0), rate));
          };
          src.connect(sp); sp.connect(ctx.destination);
          _audioNd = sp;
        }

        micBtn.innerHTML = '⏹';
        micBtn.title     = 'Tap to stop';
        micBtn.classList.add('recording');
        sys('Voice live — speak now');
        toast('🎤 Live');
      };

      ws.onclose = () => { _stopVoice(); };
      ws.onerror = () => { sys('Voice connection failed.'); _stopVoice(); };

      _voiceWs  = ws;
      _audioCtx = ctx;
      _micStm   = stream;
    }

    function _stopVoice() {
      if (_audioNd)  { try { _audioNd.disconnect(); }  catch (_) {}; _audioNd  = null; }
      if (_audioCtx) { try { _audioCtx.close(); }      catch (_) {}; _audioCtx = null; }
      if (_micStm)   { _micStm.getTracks().forEach(t => t.stop()); _micStm = null; }
      if (_voiceWs)  {
        const w = _voiceWs; _voiceWs = null;
        if (w.readyState < 2) w.close();
      }
      _micIdle();
    }
  </script>
